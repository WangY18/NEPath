[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "nepath-py"
description = "Python bindings for NEPath C++ code"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
]
authors = [
    { name = "Yunan Wang", email = "wang-yn22@mails.tsinghua.edu.cn"},
    { name = "Chuxiong Hu", email = "cxhu@tsinghua.edu.cn"},
    { name = "Jelle Feringa (ipopt and python bindings)", email = ""}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "License :: OSI Approved :: Boost Software License 1.0"
]
dynamic = ["version"]

# ============================================================================
# pytest configuration
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src/nepath_bindings"]
python_files = ["test_*.py", "*_test.py", "test.py"]
norecursedirs = [
    "external/*",
    "build/*",
    "dist/*",
    "*.egg-info",
    ".git",
    ".tox",
    ".env",
    ".pytest_cache",
    ".ruff_cache"
]
addopts = [
    "-ra",
    "--strict-markers",
    "--doctest-glob=*.rst",
    "--tb=short",
    "--import-mode=importlib"
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER"
]

# ============================================================================
# scikit-build configuration
# ============================================================================

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
cmake.version = ">=3.15"
cmake.build-type = "Release"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "NEPath/__init__.py"

[tool.scikit-build.cmake.define]
CMAKE_POLICY_DEFAULT_CMP0135 = "NEW"

# ============================================================================
# local reproducible development environment
# ============================================================================

[tool.pixi.workspace]
name = "nepath-python"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = "3.12.*"
cmake = ">=3.15"
cxx-compiler = "*"
ninja = ">=1.11"
nanobind = ">=2.13,<3"
numpy = ">=2.0,<3"
matplotlib = ">=3.10,<4"
pytest = ">=9,<10"
pytest-xdist = ">=3.8,<4"
ruff = ">=0.15,<0.16"

[tool.pixi.pypi-dependencies]
pytest-testmon = ">=2.1,<3"

[tool.pixi.tasks]
configure-cfs = "cmake -S . -B build/cfs -G Ninja -DNEPATH_ENABLE_IPOPT=OFF -DNEPATH_ENABLE_GUROBI=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=$PIXI_PROJECT_ROOT/build/cfs-install -Dnanobind_DIR=$CONDA_PREFIX/lib/python3.12/site-packages/nanobind/cmake"
build-cfs = { cmd = "cmake --build build/cfs --parallel", depends-on = ["configure-cfs"] }
install-cfs = { cmd = "cmake --install build/cfs", depends-on = ["build-cfs"] }
configure-core-tests = "cmake -S ../.. -B build/core-tests -G Ninja -DNEPATH_ENABLE_IPOPT=OFF -DNEPATH_ENABLE_GUROBI=OFF -DNEPATH_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug"
build-core-tests = { cmd = "cmake --build build/core-tests --target test_curve_ring --parallel", depends-on = ["configure-core-tests"] }
test-core = { cmd = "ctest --test-dir build/core-tests --output-on-failure", depends-on = ["build-core-tests"] }
test-cfs = { cmd = "PYTHONPATH=$PIXI_PROJECT_ROOT/build/cfs-install pytest tests/test_connect_fermat_spiral.py -n auto --testmon --testmon-noselect -q", depends-on = ["install-cfs", "test-core"] }

# ============================================================================
# cibuildwheel configuration
# ============================================================================

[tool.cibuildwheel]
build-verbosity = 3
test-requires = ["numpy", "pytest", "build"]
test-command = "pip install numpy && pip list && pytest {project}/examples"
build-frontend = "pip"
manylinux-x86_64-image = "manylinux2014"
skip = ["*_i686", "*-musllinux_*", "*-win32", "pp*"]
macos.environment.MACOSX_DEPLOYMENT_TARGET = "11.00"
macos.archs = ["x86_64", "arm64"]

# ============================================================================
# code style configuration
# ============================================================================

[tool.black]
line-length = 179

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["NEPath"]
force-single-line = true
order-by-type = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ============================================================================
# bumpversion configuration
# ============================================================================

[tool.bumpversion]
current_version = "0.1.0"
message = "Bump version to {new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "NEPath/__init__.py"
search = "{current_version}"
replace = "{new_version}"
